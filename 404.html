<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Page Not Found | Victory World</title>

  <meta
    name="description"
    content="The requested Victory World page could not be found."
  >

  <meta name="robots" content="noindex, follow">
  <meta name="theme-color" content="#070b14">

  <link
    rel="icon"
    type="image/png"
    href="assets/images/victory_world_logo.png"
  >

  <link rel="stylesheet" href="css/style.css">
</head>

<body class="error-page">
  <main class="error-page-main">
    <div class="error-glow error-glow-one"></div>
    <div class="error-glow error-glow-two"></div>

    <section class="container error-card">
      <div class="error-logo-shine">
        <img
          src="assets/images/victory_world_logo.png"
          alt="Victory World"
        >
      </div>

      <p class="eyebrow">VICTORY WORLD</p>

      <div class="error-code">404</div>

      <h1>This page has left the table.</h1>

      <p class="error-description">
        The page you requested may have moved, been renamed, or may no longer
        be available. Return to Victory World and continue exploring.
      </p>

      <div class="error-actions">
        <a class="button button-primary" href="index.html">
          Return Home
        </a>

        <a class="button button-secondary" href="index.html#games">
          Explore Games
        </a>
      </div>

      <div class="error-game-row" aria-label="Victory World games">
        <img
          src="assets/images/games/teen_patti.webp"
          alt="Teen Patti"
        >

        <img
          src="assets/images/games/rummy.webp"
          alt="Indian Rummy"
        >

        <img
          src="assets/images/games/poker.webp"
          alt="Poker"
        >

        <img
          src="assets/images/games/blackjack.webp"
          alt="Blackjack"
        >

        <img
          src="assets/images/games/ludo.webp"
          alt="Ludo"
        >

        <img
          src="assets/images/games/sports.jpg"
          alt="Sports Betting"
        >
      </div>

      <p class="error-footer-note">
        One App. Endless Excitement.
      </p>
    </section>
  </main>

  <script src="js/script.js"></script>
</body>
</html>
